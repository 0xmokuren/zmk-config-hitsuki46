# 依存はすべて SHA でピン留めしている。理由:
# 以前 revision: main のままビルドしていたところ、2026-06-02 を最後に
# BLE が不安定（接続中にフリーズ→切断、復帰にホスト再ペアが必要）になった。
# 2026-06-02 時点の最終安定ビルド (run 26823849612, sha 7b9398b) の依存 SHA に
# 戻したところ症状が消えたため、上流 main のいずれかの変更が回帰要因と判定。
# 上流 main に振り回されないよう、再現性を確保するため SHA ピンを維持する。
# 依存を更新する際は、その都度ビルドを試して安定性を再確認してから上げること。
