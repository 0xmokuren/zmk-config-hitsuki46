CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Non-LiPo Battery Management for Ni-MH batteries
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=352
CONFIG_ZMK_NON_LIPO_MAX_MV=448
CONFIG_ZMK_NON_LIPO_LOW_MV=0
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# Split Keyboard Wake/Sleep Settings
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_INPUT=y

# PMW3610 Driver (badjeff/zmk-pmw3610-driver)
# Keep symmetric with R.conf to avoid asymmetric idle/wake behavior between halves
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=16
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264

# REST mode sample times
# REST2/REST3 は 50/100ms (fast) を維持すること（R.conf と同じ理由。
# slow REST は BLE フリーズ→切断・要再ペアリングの回帰を引き起こす）。
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=50
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=100

# Extend REST mode downshift times to match R.conf
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=10000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000

# BLE Connection Stability Improvements
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# WS2812 LED Strip Configuration
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# External Power Control
CONFIG_ZMK_EXT_POWER=y

# Disable standard RGB/Backlight to prevent unexpected lighting
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# WS2812 Widget Configuration
# The LEFT LED is intentionally UNPOWERED (P-ch MOSFET held OFF via &led_power in
# the .overlay), so these settings have no visible effect. They are kept ONLY to
# satisfy the build: gohanda11 widget.c references LAYER_x_COLOR unconditionally, so
# CONFIG_WS2812_WIDGET_SHOW_*=n breaks compilation.
# NOTE: there is NO "self-healing" periodic black refresh (this was the old, wrong
# assumption). led_process_thread blocks on k_msgq_get(K_FOREVER) and the color paths
# are compiled out on the peripheral (CONFIG_ZMK_SPLIT_ROLE_CENTRAL guard), so
# current_color stays {0,0,0}; the peripheral writes black only on rare connect/battery
# events and never overwrites a noise-latched green. Hence the power must be cut.
CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y

# Timing - blink/pause durations only (NOT a periodic refresh; widget is event-driven).
# Moot while the LED is unpowered; kept aligned with the R side.
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=200
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=100
CONFIG_WS2812_WIDGET_INTERVAL_MS=200
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

# All colors set to black - peripheral side does not need LED indicators
# WS2812 GRB format makes green (first byte) most susceptible to SPI noise
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x000000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0x000000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0x000000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0x000000

CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x000000
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x000000
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x000000
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0x000000

CONFIG_WS2812_WIDGET_LAYER_0_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_2_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_3_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_4_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_5_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_6_COLOR=0x000000

CONFIG_WS2812_WIDGET_LAYER_COLOR=0x000000
