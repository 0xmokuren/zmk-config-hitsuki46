CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Non-LiPo Battery Management for Ni-MH batteries
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=352
CONFIG_ZMK_NON_LIPO_MAX_MV=448
CONFIG_ZMK_NON_LIPO_LOW_MV=0
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# Split Keyboard Wake/Sleep Settings
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_INPUT=y

# PMW3610 Driver (efogdev/zmk-pmw3610-driver, zephyr-4.1 branch)
# R.conf と対称にしておくと両半の idle/wake 挙動が揃う
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=16
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264

# REST サンプル間隔。REST1 は素早い復帰用に短く、REST2/REST3 はドライバ既定値で
# 長期アイドル中のノイズ起因ファントム motion を抑える
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=100
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=500

# アンチワープと REST 復帰直後サンプル破棄（R.conf と同じ理由で対称化）
CONFIG_PMW3610_ANTI_WARP=y
CONFIG_PMW3610_ANTI_WARP_THRES=64
CONFIG_PMW3610_ANTI_WARP_INACTIVITY_MS=10000
CONFIG_PMW3610_IGNORE_AFTER_REST=y

# Extend REST mode downshift times to match R.conf
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=10000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000

# BLE Connection Stability Improvements
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# WS2812 LED Strip Configuration
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# External Power Control
CONFIG_ZMK_EXT_POWER=y

# Disable standard RGB/Backlight to prevent unexpected lighting
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# WS2812 Widget Configuration
# Keep widget and show features enabled to maintain SPI1 data line control
# and periodically overwrite noise with black (self-healing against SPI noise)
# Disabling show features causes build errors (widget.c references LAYER_x_COLOR)
CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y

# Timing - frequent refresh to overwrite SPI noise with black
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=200
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=100
CONFIG_WS2812_WIDGET_INTERVAL_MS=200
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

# All colors set to black - peripheral side does not need LED indicators
# WS2812 GRB format makes green (first byte) most susceptible to SPI noise
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x000000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0x000000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0x000000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0x000000

CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x000000
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x000000
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x000000
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0x000000

CONFIG_WS2812_WIDGET_LAYER_0_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_2_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_3_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_4_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_5_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_6_COLOR=0x000000

CONFIG_WS2812_WIDGET_LAYER_COLOR=0x000000
