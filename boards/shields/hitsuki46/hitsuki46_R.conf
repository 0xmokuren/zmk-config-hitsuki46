CONFIG_ZMK_KEYBOARD_NAME="hitsuki46"

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BLE=y

# Increase stack sizes to prevent overflow with multiple features
# (PMW3610, WS2812, BLE Central, ZMK Studio, etc.)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Watchdog timer - auto-reset on hang
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# Increase BLE TX buffer for split keyboard stability
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_L2CAP_TX_MTU=69



CONFIG_SPI=y
CONFIG_INPUT=y

# PMW3610 Driver (efogdev/zmk-pmw3610-driver, zephyr-4.1 branch)
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=16
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300

# RUN→REST1 ダウンシフトを上限の 3264ms まで延長し、操作中の意図せぬ REST 落ちを防ぐ
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264

# REST サンプル間隔は 2026-06-02 安定ビルド (sha 7b9398b) と同じ値に維持。
# REST2/REST3 を slow (100/500ms) にすると深い PM 状態に落ちる時間が増えて
# Zephyr/SDC の latent PM bug を踏み、BLE がフリーズ→切断し再ペアリングが
# 必要になる（2026-07-07 に実機で裏付け済み。戻さないこと）。
# 動作中ジッタ/phantom motion の抑制は REST 速度ではなく
# efogdev fork の ANTI_WARP/IGNORE_AFTER_REST で行う。
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=50
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

# ZMK IDLE/SLEEP 後の REST 遷移を延ばす（force-awake は ACTIVE 中のみ RUN を維持）
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=10000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000

# アンチワープ：ANTI_WARP_INACTIVITY_MS の間動きが無かった直後の delta が
# ANTI_WARP_THRES を超えていたら破棄する。画面端で停止して再開した直後の
# 「カーソルが飛ぶ／分身する」症状に直接効く
CONFIG_PMW3610_ANTI_WARP=y
CONFIG_PMW3610_ANTI_WARP_THRES=64
CONFIG_PMW3610_ANTI_WARP_INACTIVITY_MS=10000

# init / REST 復帰直後の最初の N サンプルを問答無用に破棄する。
# REST1=20ms と組み合わせると N×20ms 分の無効化となり、
# 既定の 4（80ms）ではスリープ復帰時のジェスチャーを取り切れないので 16（320ms）に
CONFIG_PMW3610_IGNORE_FIRST_N=16
CONFIG_PMW3610_IGNORE_AFTER_REST=y

# Note: Other PMW3610 settings (CPI, invert, etc.) are configured in devicetree (.overlay)

# XY Clipper - clips diagonal scroll input to dominant axis only
CONFIG_XY_CLIPPER=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Non-LiPo Battery Management for Ni-MH batteries
# Circuit: Voltage divider with R2=1MΩ, R3=470kΩ
# Divider ratio = 470k / (1000k + 470k) = 0.32
#
# Battery voltage ranges (actual):
#   MIN = 1100mV (0%)    →  ADC = 1100 * 0.32 = 352mV
#   MAX = 1400mV (100%)  →  ADC = 1400 * 0.32 = 448mV  
#   LOW = 1050mV (shutdown) → ADC = 1050 * 0.32 = 336mV
#
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=352
CONFIG_ZMK_NON_LIPO_MAX_MV=448
CONFIG_ZMK_NON_LIPO_LOW_MV=0
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# Split Keyboard Wake/Sleep Settings
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000



CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ZMK Studio temporarily disabled to mitigate central-side hang.
# Known issue with Zephyr 4.1 + Studio causing both sides to freeze with
# the LED stuck on the last color (often red). Re-enable once upstream
# fix lands. See: https://github.com/zmkfirmware/zmk/issues/3195
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# BLE Connection Stability Improvements (Peripheral side)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# WS2812 LED Strip Configuration
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# External Power Control
CONFIG_ZMK_EXT_POWER=y

# WS2812 Widget Configuration (replacing RGB LED Widget)
CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_CONN_SHOW_USB=y

# Timing Configuration
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=200
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=100
CONFIG_WS2812_WIDGET_INTERVAL_MS=500
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

# Battery Levels
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_HIGH=80
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_CRITICAL=5

# Colors (RGB hex values) - Reduced to ~1% brightness
# Battery colors
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x000100
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0x020100
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0x020100
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0x020000

# Connectivity colors
CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x000100
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x000002
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x000102
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0x020000

# Layer-specific persistent colors (dimmed)
CONFIG_WS2812_WIDGET_LAYER_0_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0x020000
CONFIG_WS2812_WIDGET_LAYER_2_COLOR=0x000100
CONFIG_WS2812_WIDGET_LAYER_3_COLOR=0x020100
CONFIG_WS2812_WIDGET_LAYER_4_COLOR=0x000002
CONFIG_WS2812_WIDGET_LAYER_5_COLOR=0x020002
CONFIG_WS2812_WIDGET_LAYER_6_COLOR=0x000102

# Layer blink indication color
CONFIG_WS2812_WIDGET_LAYER_COLOR=0x020202
